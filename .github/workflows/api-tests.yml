name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"   # nightly run catches upstream API changes
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        options: [regression, smoke]
        default: regression

permissions:
  contents: write   # needed to push the report to gh-pages

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test -Dsuite=${{ github.event.inputs.suite || 'regression' }}

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      # The report is published from main only, so pull requests never overwrite the live report.
      - name: Load previous report (for trend history)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true   # gh-pages does not exist before the first publish
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report with history
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history target/allure-results/history; fi
          npx --yes allure-commandline@2.29.0 generate target/allure-results -o allure-report --clean

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
