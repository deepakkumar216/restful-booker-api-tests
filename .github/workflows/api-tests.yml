name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"   # nightly run catches upstream API changes
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        type: choice
        options: [regression, smoke]
        default: regression

permissions:
  contents: write   # needed to push the report to gh-pages

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: ./mvnw -B test -Dsuite=${{ github.event.inputs.suite || 'regression' }}

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          retention-days: 14

      # Publish the report only from main, so pull requests don't overwrite the live report.
      - name: Load report history
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        if: always() && github.ref == 'refs/heads/main'
        uses: simple-elf/allure-report-action@v1.9
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
